<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- MANDATORY: Declare support for both light and dark themes -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch (e) {}
  </script>
  <title>Markdown Studio — GFM &amp; Mermaid Dual-Pane Editor</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-leading">
      <button type="button" id="btn-toggle-sidebar" class="mac-btn mac-btn-icon" title="Toggle Local Files Sidebar (⌘⇧E)" aria-label="Toggle Local Files Sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <div class="mac-segmented" role="group" aria-label="File open actions">
        <button type="button" id="btn-open-file" class="mac-seg-item" title="Open Local Markdown File (⌘O)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Open</span>
        </button>
        <button type="button" id="btn-open-folder" class="mac-seg-item" title="Open Local Folder (⌘⇧O)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Folder</span>
        </button>
      </div>

      <button type="button" id="btn-save-file" class="mac-btn" title="Save Document (⌘S)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Save</span>
      </button>

      <!-- Fallback hidden file inputs -->
      <input type="file" id="file-input" accept=".md,.markdown,.txt,.mdx" hidden>
      <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
    </div>

    <div class="header-center">
      <div class="window-title-pill">
        <svg class="doc-proxy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <h1 id="current-filename" aria-live="polite">welcome.md</h1>
        <span id="dirty-indicator" class="dirty-dot" hidden title="Edited — Unsaved changes" aria-label="Unsaved changes"></span>
      </div>

      <div class="mac-segmented formatting-bar" role="group" aria-label="Markdown formatting shortcuts">
        <button type="button" class="mac-seg-item" data-insert="bold" aria-label="Bold" title="Bold (**text**)">
          <strong>B</strong>
        </button>
        <button type="button" class="mac-seg-item" data-insert="italic" aria-label="Italic" title="Italic (*text*)">
          <em>I</em>
        </button>
        <button type="button" class="mac-seg-item" data-insert="code" aria-label="Code block" title="Insert Code Block">
          <code>&lt;/&gt;</code>
        </button>
        <button type="button" class="mac-seg-item" data-insert="table" aria-label="Insert GFM Table" title="Insert GFM Table">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
          <span>Table</span>
        </button>
        <button type="button" class="mac-seg-item" data-insert="alert" aria-label="Insert GitHub Alert" title="Insert GitHub Alert">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Alert</span>
        </button>
        <button type="button" class="mac-seg-item" data-insert="mermaid" aria-label="Insert Mermaid Diagram" title="Insert Mermaid Diagram">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="18" cy="6" r="3"></circle>
            <circle cx="12" cy="18" r="3"></circle>
            <line x1="8.5" y1="7.5" x2="10.5" y2="15.5"></line>
            <line x1="15.5" y1="7.5" x2="13.5" y2="15.5"></line>
          </svg>
          <span>Mermaid</span>
        </button>
      </div>
    </div>

    <nav class="header-trailing" aria-label="Layout and appearance controls">
      <div class="mac-segmented layout-switcher" role="group" aria-label="Pane layout mode">
        <button type="button" id="btn-view-editor" class="mac-seg-item" aria-pressed="false" title="Editor Only — Minimize Preview (⌘1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
            <path d="M3 6.5C3 5.12 4.12 4 5.5 4H14v16H5.5C4.12 20 3 18.88 3 17.5V6.5z" fill="currentColor" fill-opacity="0.28"></path>
            <line x1="14" y1="4" x2="14" y2="20"></line>
          </svg>
          <span>Editor</span>
        </button>
        <button type="button" id="btn-view-split" class="mac-seg-item" aria-pressed="true" title="Dual-Pane Split View (⌘2)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          <span>Split</span>
        </button>
        <button type="button" id="btn-view-preview" class="mac-seg-item" aria-pressed="false" title="Preview Only — Minimize Editor (⌘3)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
            <path d="M10 4h8.5C19.88 4 21 5.12 21 6.5v11c0 1.38-1.12 2.5-2.5 2.5H10V4z" fill="currentColor" fill-opacity="0.28"></path>
            <line x1="10" y1="4" x2="10" y2="20"></line>
          </svg>
          <span>Preview</span>
        </button>
      </div>

      <label class="mac-pill-toggle" title="Synchronize scrolling by document headers and sections (⌘Y)">
        <input type="checkbox" id="chk-sync-scroll" checked>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="7 8 3 12 7 16"></polyline>
          <polyline points="17 8 21 12 17 16"></polyline>
          <line x1="3" y1="12" x2="21" y2="12"></line>
        </svg>
        <span>Sync</span>
      </label>

      <button type="button" id="btn-sample" class="mac-btn" title="Reset to built-in GFM &amp; Mermaid showcase (⌘R)">
        <span>Demo</span>
      </button>

      <button type="button" id="btn-theme-toggle" class="mac-btn mac-btn-icon" aria-label="Toggle color scheme" title="Toggle Light / Dark Appearance (⌘T)">
        <span class="theme-option theme-to-dark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="sr-only">Switch to dark theme</span>
        </span>
        <span class="theme-option theme-to-light">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span class="sr-only">Switch to light theme</span>
        </span>
      </button>
    </nav>
  </header>

  <main class="workspace" id="workspace">
    <!-- Translucent macOS Finder-Style Source List Sidebar -->
    <aside id="file-sidebar" class="file-sidebar" hidden aria-label="Local Markdown files">
      <div class="sidebar-header">
        <h2>Workspace</h2>
        <button type="button" id="btn-close-sidebar" class="btn-pane-toggle" aria-label="Hide file sidebar" title="Hide Sidebar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <ul id="file-list" class="file-list"></ul>
    </aside>

    <!-- Left Pane: Markdown Editor -->
    <section class="pane editor-pane" id="editor-pane" aria-label="Markdown Editor">
      <div class="pane-header">
        <div class="pane-breadcrumb">
          <span class="pane-chip">SOURCE</span>
          <span class="pane-title-text">Markdown Editor</span>
        </div>
        <div class="pane-actions">
          <span class="drop-hint">Drop <code>.md</code> file to open</span>
          <button
            type="button"
            id="btn-toggle-editor-pane"
            class="btn-pane-toggle"
            aria-label="Minimize Markdown Editor pane"
            title="Minimize or restore Editor pane (⌘3)"
          >
            <svg class="icon-minimize" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div class="editor-wrapper" id="editor-dropzone">
        <div class="line-numbers" id="line-numbers" aria-hidden="true">1</div>
        <textarea
          id="markdown-input"
          class="markdown-textarea"
          spellcheck="false"
          aria-label="Markdown source code editor"
          placeholder="Write Markdown or drag and drop a local .md file..."
        ></textarea>
        <div id="drop-overlay" class="drop-overlay" hidden>
          <div class="drop-message">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p>Drop local Markdown file to open</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Tactile NSSplitView Divider with Grab Handle -->
    <div
      id="pane-splitter"
      class="pane-splitter"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize editor and preview panes"
      tabindex="0"
    >
      <span class="splitter-pill" aria-hidden="true"></span>
    </div>

    <!-- Right Pane: Rendered GitHub Markdown + Mermaid Preview -->
    <section class="pane preview-pane" id="preview-pane" aria-label="Rendered GitHub Markdown Preview">
      <div class="pane-header">
        <div class="pane-breadcrumb">
          <span class="pane-chip pane-chip-accent">PREVIEW</span>
          <span class="pane-title-text">GitHub Flavored Markdown &amp; Mermaid</span>
        </div>
        <div class="pane-actions">
          <span id="mermaid-status" class="status-pill" aria-live="polite">Ready</span>
          <button
            type="button"
            id="btn-toggle-preview-pane"
            class="btn-pane-toggle"
            aria-label="Minimize Preview pane"
            title="Minimize or restore Preview pane (⌘1)"
          >
            <svg class="icon-minimize" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div class="preview-scroll-container" id="preview-container">
        <article id="markdown-preview" class="markdown-body"></article>
      </div>
    </section>
  </main>

  <footer class="app-statusbar">
    <div class="status-left">
      <span class="status-metric" id="stat-lines">0 lines</span>
      <span class="status-sep" aria-hidden="true">&middot;</span>
      <span class="status-metric" id="stat-words">0 words</span>
      <span class="status-sep" aria-hidden="true">&middot;</span>
      <span class="status-metric" id="stat-chars">0 chars</span>
    </div>
    <div class="status-right">
      <span id="file-source-type" class="status-badge">Built-in Demo</span>
      <span class="status-sep" aria-hidden="true">&middot;</span>
      <span class="status-engine">GFM &bull; Mermaid v11 &bull; Section Sync</span>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
