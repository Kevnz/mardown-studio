<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- MANDATORY: Declare support for both light and dark themes -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch (e) {}
  </script>
  <title>Markdown Studio — GFM &amp; Mermaid Dual-Pane Editor</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <h1>Markdown Studio</h1>
      <span id="current-filename" class="filename-badge" aria-live="polite">welcome.md</span>
      <span id="dirty-indicator" class="dirty-dot" hidden title="Unsaved changes" aria-label="Unsaved changes"></span>
    </div>

    <nav class="toolbar" aria-label="Document and view actions">
      <div class="toolbar-group">
        <button type="button" id="btn-open-file" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Open File</span>
        </button>
        <button type="button" id="btn-open-folder" class="btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
          <span>Open Folder</span>
        </button>
        <button type="button" id="btn-save-file" class="btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>Save</span>
        </button>
        <button type="button" id="btn-sample" class="btn" title="Load showcase Markdown with GFM &amp; Mermaid examples">
          <span>Reset Demo</span>
        </button>
        <!-- Fallback hidden file inputs -->
        <input type="file" id="file-input" accept=".md,.markdown,.txt,.mdx" hidden>
        <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
      </div>

      <div class="toolbar-divider" role="separator"></div>

      <div class="toolbar-group formatting-bar" aria-label="Markdown formatting shortcuts">
        <button type="button" class="btn btn-icon" data-insert="bold" aria-label="Bold">
          <strong>B</strong>
        </button>
        <button type="button" class="btn btn-icon" data-insert="italic" aria-label="Italic">
          <em>I</em>
        </button>
        <button type="button" class="btn btn-icon" data-insert="code" aria-label="Code block">
          <code>&lt;/&gt;</code>
        </button>
        <button type="button" class="btn btn-icon" data-insert="table" aria-label="Insert GFM Table">
          <span>Table</span>
        </button>
        <button type="button" class="btn btn-icon" data-insert="alert" aria-label="Insert GitHub Alert">
          <span>Alert</span>
        </button>
        <button type="button" class="btn btn-icon" data-insert="mermaid" aria-label="Insert Mermaid Diagram">
          <span>Mermaid</span>
        </button>
      </div>

      <div class="toolbar-divider" role="separator"></div>

      <div class="toolbar-group layout-switcher" role="group" aria-label="Pane layout mode">
        <button type="button" id="btn-view-editor" class="btn btn-icon" aria-pressed="false" title="Maximize Editor (Minimize Preview)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
          <span>Editor</span>
        </button>
        <button type="button" id="btn-view-split" class="btn btn-icon" aria-pressed="true" title="Dual-Pane Split View">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
          <span>Split</span>
        </button>
        <button type="button" id="btn-view-preview" class="btn btn-icon" aria-pressed="false" title="Maximize Preview (Minimize Editor)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span>Preview</span>
        </button>
      </div>

      <div class="toolbar-divider" role="separator"></div>

      <div class="toolbar-group">
        <label class="sync-toggle">
          <input type="checkbox" id="chk-sync-scroll" checked>
          <span>Sync Scroll</span>
        </label>

        <button type="button" id="btn-theme-toggle" class="btn btn-icon" aria-label="Toggle color scheme">
          <span class="theme-option theme-to-dark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="sr-only">Switch to dark theme</span>
          </span>
          <span class="theme-option theme-to-light">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="sr-only">Switch to light theme</span>
          </span>
        </button>
      </div>
    </nav>
  </header>

  <main class="workspace" id="workspace">
    <!-- Optional File Drawer when folder or multiple files are loaded -->
    <aside id="file-sidebar" class="file-sidebar" hidden aria-label="Local Markdown files">
      <div class="sidebar-header">
        <h2>Files</h2>
        <button type="button" id="btn-close-sidebar" class="btn btn-icon" aria-label="Close file sidebar">&times;</button>
      </div>
      <ul id="file-list" class="file-list"></ul>
    </aside>

    <!-- Left Pane: Markdown Editor -->
    <section class="pane editor-pane" id="editor-pane" aria-label="Markdown Editor">
      <div class="pane-header">
        <span class="pane-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span class="pane-title-text">Markdown Source</span>
        </span>
        <div class="pane-actions">
          <span class="drop-hint">Drag &amp; drop any <code>.md</code> file here</span>
          <button
            type="button"
            id="btn-toggle-editor-pane"
            class="btn-pane-toggle"
            aria-label="Minimize Markdown Editor pane"
            title="Minimize or restore Editor pane"
          >
            <svg class="icon-minimize" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div class="editor-wrapper" id="editor-dropzone">
        <div class="line-numbers" id="line-numbers" aria-hidden="true">1</div>
        <textarea
          id="markdown-input"
          class="markdown-textarea"
          spellcheck="false"
          aria-label="Markdown source code editor"
          placeholder="Type Markdown or drag and drop a local .md file here..."
        ></textarea>
        <div id="drop-overlay" class="drop-overlay" hidden>
          <div class="drop-message">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p>Drop local Markdown file to open</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Draggable Splitter -->
    <div
      id="pane-splitter"
      class="pane-splitter"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize editor and preview panes"
      tabindex="0"
    ></div>

    <!-- Right Pane: Rendered GitHub Markdown + Mermaid Preview -->
    <section class="pane preview-pane" id="preview-pane" aria-label="Rendered GitHub Markdown Preview">
      <div class="pane-header">
        <span class="pane-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span class="pane-title-text">GitHub Flavored Preview + Mermaid</span>
        </span>
        <div class="pane-actions">
          <span id="mermaid-status" class="status-pill" aria-live="polite">Ready</span>
          <button
            type="button"
            id="btn-toggle-preview-pane"
            class="btn-pane-toggle"
            aria-label="Minimize Preview pane"
            title="Minimize or restore Preview pane"
          >
            <svg class="icon-minimize" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div class="preview-scroll-container" id="preview-container">
        <article id="markdown-preview" class="markdown-body"></article>
      </div>
    </section>
  </main>

  <footer class="app-statusbar">
    <div class="status-left">
      <span id="stat-lines">0 lines</span>
      <span class="status-sep">&bull;</span>
      <span id="stat-words">0 words</span>
      <span class="status-sep">&bull;</span>
      <span id="stat-chars">0 chars</span>
    </div>
    <div class="status-right">
      <span id="file-source-type">In-memory buffer</span>
      <span class="status-sep">&bull;</span>
      <span>GFM + Mermaid v11</span>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
